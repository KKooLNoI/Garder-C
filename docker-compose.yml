# UNVERIFIED: written without Docker available in the authoring environment. Nothing in this file has been run.
#
# SECURITY NOTE: Judge0 runs submissions with the `isolate` sandbox, which needs `privileged: true` on the
# judge0 containers (and a host using cgroup v1 for Judge0 1.13.x). This conflicts with a strict
# "no privileged containers" policy. It is contained by keeping Judge0 on an internal network with no published
# ports, requiring an auth token, and never running the web app or the worker privileged.
#
# Usage: copy .env.example to .env and judge0.conf.example to judge0.conf, set real secrets, then
#   docker compose up -d db redis judge0-db
#   docker compose run --rm migrate
#   docker compose up -d

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpractice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cpractice
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpractice"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &appenv
      DATABASE_URL: postgresql://cpractice:${POSTGRES_PASSWORD}@db:5432/cpractice
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      JUDGE0_URL: http://judge0:2358
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?set JUDGE0_AUTH_TOKEN}
      JUDGE0_C_LANGUAGE_ID: ${JUDGE0_C_LANGUAGE_ID:-50}
    depends_on: { db: { condition: service_healthy } }
    networks: [backend]
    profiles: [tools]

  app:
    build: .
    restart: unless-stopped
    environment: *appenv
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    networks: [backend, judge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment: *appenv
    depends_on: { db: { condition: service_healthy } }
    networks: [backend, judge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Daily logical backup into the `backups` volume, 14-day retention (see scripts/backup.sh).
  # Copy the volume off the host regularly; a backup on the same disk does not survive disk loss.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cpractice:${POSTGRES_PASSWORD}@db:5432/cpractice
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["bash", "-c", "while true; do /scripts/backup.sh || echo 'BACKUP FAILED' >&2; sleep 86400; done"]
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    depends_on: { db: { condition: service_healthy } }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  # ---- Judge0 CE (isolated network; no published ports) ----
  judge0:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/server"]
    privileged: true
    env_file: judge0.conf
    depends_on: [judge0-db, redis]
    networks: [judge, judge-internal]

  judge0-workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true
    # Bound what runaway submissions can take from the host.
    mem_limit: 4g
    pids_limit: 2048
    env_file: judge0.conf
    depends_on: [judge0-db, redis]
    networks: [judge-internal]

  judge0-db:
    image: postgres:16
    restart: unless-stopped
    env_file: judge0.conf
    volumes: [judge0data:/var/lib/postgresql/data]
    networks: [judge-internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    networks: [judge-internal]

volumes:
  pgdata:
  judge0data:
  backups:

networks:
  backend: {}
  judge: {}
  # `internal: true` means containers on this network have no route to the internet or the host.
  judge-internal:
    internal: true
